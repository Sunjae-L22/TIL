<text x="65" y="909" font-family="Arial, Apple SD Gothic Neo" font-size="27" font-weight="700" fill="#172a46">INNER: 매칭된 4행</text>
<text x="540" y="909" font-family="Arial, Apple SD Gothic Neo" font-size="27" font-weight="700" fill="#172a46">LEFT: 미매칭 포함 5행</text>
<text x="45" y="962" font-family="Arial, Apple SD Gothic Neo" font-size="24" font-weight="400" fill="#52647a">같은 고객이 여러 주문과 연결되면 이름도 여러 행에 나타난다.</text>
