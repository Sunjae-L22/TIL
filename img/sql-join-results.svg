<text x="70" y="460" font-family="Arial, Apple SD Gothic Neo" font-size="32" font-weight="700" fill="#255bbe">INNER JOIN</text>
<text x="70" y="510" font-family="Arial, Apple SD Gothic Neo" font-size="25" font-weight="400" fill="#65758d">order_id       name</text>
<text x="75" y="561" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">101</text>
