<text x="545" y="460" font-family="Arial, Apple SD Gothic Neo" font-size="32" font-weight="700" fill="#255bbe">LEFT JOIN</text>
<text x="545" y="510" font-family="Arial, Apple SD Gothic Neo" font-size="25" font-weight="400" fill="#65758d">order_id       name</text>
<text x="550" y="561" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">101</text>
<text x="730" y="561" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">지우</text>
<text x="550" y="615" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">102</text>
<text x="730" y="615" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">지우</text>
<text x="550" y="669" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">103</text>
<text x="730" y="669" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">다온</text>
<rect x="535" y="688" width="405" height="48" rx="16" fill="#fff0d5" stroke="#eac887"/>
<text x="550" y="723" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">104</text>
<text x="730" y="723" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#ad651b">NULL</text>
