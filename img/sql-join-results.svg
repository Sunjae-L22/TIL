<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
<rect width="1000" height="1000" fill="#f4f7fb"/>
<text x="45" y="60" font-family="Arial, Apple SD Gothic Neo" font-size="23" font-weight="700" fill="#4271cc">01 / JOIN</text>
<text x="45" y="116" font-family="Arial, Apple SD Gothic Neo" font-size="39" font-weight="700" fill="#172a46">같은 주문, 다른 보존 기준</text>
<text x="45" y="160" font-family="Arial, Apple SD Gothic Neo" font-size="24" font-weight="400" fill="#52647a">ON c.customer_id = o.customer_id</text>
<rect x="45" y="200" width="910" height="175" rx="16" fill="#ffffff" stroke="#d9e3ef"/>
<text x="70" y="241" font-family="Arial, Apple SD Gothic Neo" font-size="27" font-weight="700" fill="#172a46">입력: 주문 5건 · 고객 4명</text>
<text x="70" y="290" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">101 → 1    102 → 1    103 → 2</text>
<text x="70" y="335" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">104 → NULL    105 → 2</text>
