<text x="75" y="669" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">103</text>
<text x="255" y="669" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">다온</text>
<text x="75" y="723" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">105</text>
<text x="255" y="723" font-family="Arial, Apple SD Gothic Neo" font-size="29" font-weight="400" fill="#172a46">다온</text>
