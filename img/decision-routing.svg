<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1030" viewBox="0 0 720 1030"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#397D68"/></marker></defs><rect width="720" height="1030" fill="#F7F5EE"/><g font-family="Apple SD Gothic Neo, sans-serif"><text x="48" y="68" font-size="39" fill="#24332F" font-weight="700" text-anchor="start">확률을 다음 행동에 연결하기</text><text x="48" y="118" font-size="32" fill="#397D68" font-weight="600" text-anchor="start">최대 선택 확률 ≥ 0.90 ?</text><path d="M48 151 L672 151" stroke="#B8C7BE" stroke-width="3" fill="none"/><text x="48" y="220" font-size="34" fill="#24332F" font-weight="600" text-anchor="start">명확한 문의</text><text x="48" y="269" font-size="36" fill="#397D68" font-weight="700" text-anchor="start">결제 0.92</text><rect x="48" y="305" width="624" height="26" rx="8" fill="#D9E8DF"/><rect x="48" y="305" width="574" height="26" rx="8" fill="#397D68"/><path d="M610 289 L610 348" stroke="#B36648" stroke-width="3" fill="none"/><path d="M360 366 L360 412" stroke="#397D68" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="360" y="466" font-size="34" fill="#397D68" font-weight="700" text-anchor="middle">담당 부서로 자동 분류</text><path d="M48 511 L672 511" stroke="#B8C7BE" stroke-width="3" fill="none"/><text x="48" y="582" font-size="34" fill="#24332F" font-weight="600" text-anchor="start">내용이 섞인 문의</text><text x="48" y="631" font-size="36" fill="#B36648" font-weight="700" text-anchor="start">결제 0.55</text><rect x="48" y="667" width="624" height="26" rx="8" fill="#D9E8DF"/><rect x="48" y="667" width="343" height="26" rx="8" fill="#B36648"/><path d="M610 651 L610 710" stroke="#B36648" stroke-width="3" fill="none"/><path d="M360 728 L360 774" stroke="#397D68" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="360" y="828" font-size="34" fill="#B36648" font-weight="700" text-anchor="middle">사람이 검토하고 재분류</text><path d="M48 875 L672 875" stroke="#B8C7BE" stroke-width="3" fill="none"/><text x="48" y="936" font-size="34" fill="#24332F" font-weight="600" text-anchor="start">높은 확률 ≠ 정답 보장</text><text x="48" y="982" font-size="29" fill="#24332F" font-weight="400" text-anchor="start">가상 확률 · 임계값은 업무에 맞춰 검증</text></g></svg>